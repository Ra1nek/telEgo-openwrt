name: "🇷🇺 🐞 Сообщить об ошибке"
description: "Сообщить о проблеме с MTProxy, LuCI, WEB Proxy, установкой или пакетами"
title: "[Bug]: "
labels: []
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Спасибо за сообщение об ошибке. Заполните только то, что поможет воспроизвести проблему.

        > **Важно:** не публикуйте secret, proxy tag, private key, session token и полный `/etc/config/telego`. Чувствительные IP-адреса и домены можно скрыть.

  - type: dropdown
    id: component
    attributes:
      label: "Что не работает?"
      description: "Выберите область, которая ближе всего к проблеме."
      options:
        - "telEgo / MTProxy / FakeTLS"
        - "LuCI"
        - "WEB Proxy / Nginx"
        - "Telegram Middle-End"
        - "Установка / обновление / удаление"
        - "APK / зависимости"
        - "Телеметрия / rpcd / Prometheus"
        - "GitHub Actions / сборка"
        - "Документация"
        - "Другое"
    validations:
      required: true

  - type: input
    id: openwrt_version
    attributes:
      label: "Версия OpenWrt"
      description: "Укажите версию прошивки. Поддерживаемая ветка проекта — OpenWrt 25.12.x."
      placeholder: "Например: 25.12.5"
    validations:
      required: true

  - type: input
    id: package_version
    attributes:
      label: "Версия telEgo / пакетов"
      description: "Если знаете, укажите версию установленного пакета или канал установки."
      placeholder: "Например: telego-pkg 0.6.1-r7 / develop-latest"
    validations:
      required: false

  - type: textarea
    id: problem
    attributes:
      label: "Что произошло?"
      description: "Коротко опишите фактическое поведение и что вы ожидали увидеть вместо него."
      placeholder: "Например: после Save & Apply служба не запускается, а LuCI показывает Stopped."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: "Как повторить проблему?"
      description: "Укажите минимальную последовательность действий."
      placeholder: |
        1. Открыл Services → telEgo
        2. Изменил ...
        3. Нажал Save & Apply
        4. Получил ...
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: "Диагностика"
      description: |
        Вставьте короткий вывод команд ниже. Оставьте только строки, относящиеся к проблеме, и удалите чувствительные данные.

        Рекомендуемые команды:
        `ubus call telego status`
        `logread -e telego`
      render: shell
      placeholder: |
        $ ubus call telego status
        ...

        $ logread -e telego
        ...
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: "Дополнительная информация"
      description: "Скриншоты, ссылка на неудачный запуск GitHub Actions, сведения о браузере для LuCI или другие детали — только если они действительно помогают."
      placeholder: "Необязательно"
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: "Перед отправкой"
      options:
        - label: "Я проверил текст и удалил secrets, ключи и другие чувствительные данные."
          required: true
