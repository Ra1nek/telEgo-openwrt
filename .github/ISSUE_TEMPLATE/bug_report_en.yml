name: "🇬🇧 🐞 Bug report"
description: "Report a problem with MTProxy, LuCI, WEB Proxy, installation, or packages"
title: "[Bug]: "
labels: []
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please provide only the information needed to reproduce it.

        > **Important:** do not publish secrets, proxy tags, private keys, session tokens, or a complete `/etc/config/telego`. Redact sensitive IP addresses and hostnames if necessary.

  - type: dropdown
    id: component
    attributes:
      label: "What is not working?"
      description: "Choose the area that best matches the problem."
      options:
        - "telEgo / MTProxy / FakeTLS"
        - "LuCI"
        - "WEB Proxy / Nginx"
        - "Telegram Middle-End"
        - "Install / upgrade / uninstall"
        - "APK / dependencies"
        - "Telemetry / rpcd / Prometheus"
        - "GitHub Actions / build"
        - "Documentation"
        - "Other"
    validations:
      required: true

  - type: input
    id: openwrt_version
    attributes:
      label: "OpenWrt version"
      description: "Enter the firmware version. The supported project branch is OpenWrt 25.12.x."
      placeholder: "Example: 25.12.5"
    validations:
      required: true

  - type: input
    id: package_version
    attributes:
      label: "telEgo / package version"
      description: "If known, enter the installed package version or installation channel."
      placeholder: "Example: telego-pkg 0.6.1-r7 / develop-latest"
    validations:
      required: false

  - type: textarea
    id: problem
    attributes:
      label: "What happened?"
      description: "Briefly describe the actual behavior and what you expected instead."
      placeholder: "Example: after Save & Apply the service does not start and LuCI shows Stopped."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: "How can we reproduce it?"
      description: "Provide the shortest sequence of steps that reproduces the issue."
      placeholder: |
        1. Open Services → telEgo
        2. Change ...
        3. Click Save & Apply
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: "Diagnostics"
      description: |
        Paste a short excerpt from the commands below. Keep only the lines relevant to the problem and remove sensitive data.

        Recommended commands:
        `ubus call telego status`
        `logread -e telego`
      render: shell
      placeholder: |
        $ ubus call telego status
        ...

        $ logread -e telego
        ...
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: "Additional information"
      description: "Screenshots, a failed GitHub Actions run, browser details for LuCI, or other context only when it helps diagnose the issue."
      placeholder: "Optional"
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: "Before submitting"
      options:
        - label: "I reviewed the report and removed secrets, keys, and other sensitive data."
          required: true
