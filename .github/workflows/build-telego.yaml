name: Build telEgo Packages

on:
  push:
    branches: [main]
    paths:
      - 'package/**'
      - '.github/workflows/build-telego.yaml'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  TELEGO_VERSION: "0.6.0"

jobs:
  build-all-packages:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: telego-src/go.sum
      
      - name: Download OpenWrt SDK 25.12.4
        run: |
          echo "Downloading OpenWrt SDK..."
          curl -L -o sdk.tar.zst https://downloads.openwrt.org/releases/25.12.4/targets/x86/64/openwrt-sdk-25.12.4-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          mkdir -p openwrt-sdk && tar --zstd -xf sdk.tar.zst -C openwrt-sdk --strip-components=1
      
      - name: Setup Local Feed
        run: |
          cd openwrt-sdk
          # Copy feeds.conf.default from repo root to SDK directory
          cp ../../feeds.conf.default ./feeds.conf.default
          # Register local feed with packages using relative path (canonical SDK syntax)
          echo "src-link action ." >> feeds.conf.default
          # Create symlinks for all packages in the openwrt-sdk package directory
          ln -sf ../../../package/telego package/telego 2>/dev/null || true
          ln -sf ../../../package/luci-app-telego package/luci-app-telego 2>/dev/null || true
          ln -sf ../../../package/nginx-telego package/nginx-telego 2>/dev/null || true
      
      - name: Build telEgo Core Package
        working-directory: openwrt-sdk
        run: |
          echo "=== Building telEgo Core Package ==="
          make package/telego/clean V=s 2>&1 || true
          make package/telego/compile V=s 2>&1
          ls -lh bin/packages/*/*/telego_*.apk || true
      
      - name: Build LuCI Application Packages
        working-directory: openwrt-sdk
        run: |
          echo "=== Building LuCI Application Packages ==="
          make package/luci-app-telego/clean V=s 2>&1 || true
          make package/luci-app-telego/compile V=s 2>&1
          ls -lh bin/packages/*/*/luci-*.apk || true
      
      - name: Build Nginx Configuration Package
        working-directory: openwrt-sdk
        run: |
          echo "=== Building Nginx Configuration Package ==="
          make package/nginx-telego/clean V=s 2>&1 || true
          make package/nginx-telego/compile V=s 2>&1
          ls -lh bin/packages/*/*/nginx-*.apk || true
      
      - name: Collect All Built Packages
        run: |
          echo "=== Collecting All Built Packages ==="
          mkdir -p packages
          find openwrt-sdk/bin/packages -name "*.apk" 2>/dev/null | while read f; do cp "$f" packages/; done || true
          ls -lh packages/*.apk 2>&1 || echo "No APK files found"
      
      - name: Upload telEgo Core Package
        uses: actions/upload-artifact@v4
        with:
          name: telego-core-package
          path: packages/telego_*.apk
          retention-days: 30
      
      - name: Upload LuCI Packages
        uses: actions/upload-artifact@v4
        with:
          name: luci-packages
          path: packages/luci-*.apk
          retention-days: 30
      
      - name: Upload Nginx Package
        uses: actions/upload-artifact@v4
        with:
          name: nginx-package
          path: packages/nginx-*.apk
          retention-days: 30