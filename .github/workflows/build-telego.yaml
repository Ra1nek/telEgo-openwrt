name: Build telEgo Packages

on:
  push:
    branches: [main]
    paths:
      - 'package/**'
      - '.github/workflows/build-telego.yaml'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  TELEGO_VERSION: "0.6.0"

jobs:
  build-all-packages:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: telego-src/go.sum
      
      - name: Build telEgo Core Package
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: x86_64
          PACKAGES: telego
          V: s
      
      - name: Build LuCI Application Packages
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: x86_64
          PACKAGES: luci-app-telego
          V: s
      
      - name: Build Nginx Configuration Package
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: x86_64
          PACKAGES: nginx-telego
          V: s
      
      - name: Collect All Built Packages
        run: |
          echo "=== Collecting All Built Packages ==="
          mkdir -p packages
          find bin/packages -name "*.apk" 2>/dev/null | while read f; do cp "$f" packages/; done || true
          ls -lh packages/*.apk 2>&1 || echo "No APK files found"
      
      - name: Upload telEgo Core Package
        uses: actions/upload-artifact@v4
        with:
          name: telego-core-package
          path: packages/telego_*.apk
          retention-days: 30
      
      - name: Upload LuCI Packages
        uses: actions/upload-artifact@v4
        with:
          name: luci-packages
          path: packages/luci-*.apk
          retention-days: 30
      
      - name: Upload Nginx Package
        uses: actions/upload-artifact@v4
        with:
          name: nginx-package
          path: packages/nginx-*.apk
          retention-days: 30