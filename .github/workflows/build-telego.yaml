name: Build telEgo Packages

on:
  push:
    branches: [main]
    paths:
      - 'package/**'
      - 'telego-src'
      - '.gitmodules'
      - 'patches/**'
      - 'feeds.conf.default'
      - '.github/workflows/build-telego.yaml'
      - '.github/scripts/**'
  pull_request:
    branches: [main]
    paths:
      - 'package/**'
      - 'telego-src'
      - '.gitmodules'
      - 'patches/**'
      - 'feeds.conf.default'
      - '.github/workflows/build-telego.yaml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-all-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Determine version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^PKG_VERSION:=//p' package/telego-pkg/Makefile | head -n1)"
          test -n "$version"
          echo "TELEGO_VERSION=$version" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: telego-src/go.sum

      - name: Apply OpenWrt source patch
        run: python3 .github/scripts/apply-upstream-patches.py

      - name: Verify LuCI i18n
        run: python3 .github/scripts/check-luci-i18n.py

      - name: Verify Go source
        working-directory: telego-src
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

      - name: Build Go Binary
        working-directory: telego-src
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p ../package/telego-pkg/files/usr/bin
          go build \
            -buildmode=pie \
            -trimpath \
            -buildvcs=false \
            -ldflags="-s -w -X main.version=${TELEGO_VERSION} -X main.commit=${GITHUB_SHA} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o ../package/telego-pkg/files/usr/bin/telego \
            ./cmd/telego
          chmod 0755 ../package/telego-pkg/files/usr/bin/telego
          file ../package/telego-pkg/files/usr/bin/telego

      - name: Build OpenWrt APK Packages
        uses: openwrt/gh-action-sdk@f5813d30eeef3534b58ac7e79c5d8842b6035434
        env:
          ARCH: x86_64
          FEED_DIR: ${{ github.workspace }}
          FEEDNAME: telego
          PACKAGES: 'telego-pkg nginx-telego luci-app-telego luci-i18n-telego-ru'
          INDEX: 1
          V: s

      - name: Verify APK feed
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find bin/packages -type f -name '*.apk' -print -quit)"
          test -n "$(find bin/packages -type f -name 'packages.adb' -print -quit)"

      - name: Store APK feed
        uses: actions/upload-artifact@v7
        with:
          name: telEgo-openwrt-apk-feed
          path: bin/packages/**
          if-no-files-found: error
