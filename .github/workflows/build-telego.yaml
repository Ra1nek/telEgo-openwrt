name: Build telEgo Packages

on:
  push:
    branches: [main]
    paths:
      - 'package/**'
      - '.github/workflows/build-telego.yaml'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  TELEGO_VERSION: "0.6.0"

jobs:
  build-all-packages:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      
      - name: Download OpenWrt SDK 23.05.6
        run: |
          echo "Downloading OpenWrt SDK..."
          SDK_URL="https://downloads.openwrt.org/releases/23.05.6/sdk/OpenWrt-SDK-23.05.6_x86_64_gcc-x86_64_musl-linux-gnu.tar.gz"
          wget -q "$SDK_URL" --progress=bar:force
          tar -xf OpenWrt-SDK-*.tar.gz
          mv OpenWrt-SDK-* openwrt-sdk
      
      - name: Register Local Feed
        run: |
          cd openwrt-sdk
          echo "src-local file ../package" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      
      - name: Build telEgo Core Package
        working-directory: openwrt-sdk
        run: |
          echo "=== Building telEgo Core Package ==="
          make package/feeds/file/telego/clean V=s
          make package/feeds/file/telego/compile V=s
          ls -lh bin/packages/*/*/telego_*.apk || true
      
      - name: Build LuCI Application Packages
        working-directory: openwrt-sdk
        run: |
          echo "=== Building LuCI Application Packages ==="
          make package/feeds/file/luci-app-telego/clean V=s
          make package/feeds/file/luci-app-telego/compile V=s
          ls -lh bin/packages/*/*/luci-*.apk || true
      
      - name: Build Nginx Configuration Package
        working-directory: openwrt-sdk
        run: |
          echo "=== Building Nginx Configuration Package ==="
          make package/feeds/file/nginx-telego/clean V=s
          make package/feeds/file/nginx-telego/compile V=s
          ls -lh bin/packages/*/*/nginx-*.apk || true
      
      - name: Collect All Built Packages
        run: |
          echo "=== Collecting All Built Packages ==="
          mkdir -p packages
          find openwrt-sdk/bin/packages -name "*.apk" -exec cp {} packages/ \;
          ls -lh packages/*.apk
      
      - name: Upload telEgo Core Package
        uses: actions/upload-artifact@v4
        with:
          name: telego-core-package
          path: packages/telego_*.apk
          retention-days: 30
      
      - name: Upload LuCI Packages
        uses: actions/upload-artifact@v4
        with:
          name: luci-packages
          path: packages/luci-*.apk
          retention-days: 30
      
      - name: Upload Nginx Package
        uses: actions/upload-artifact@v4
        with:
          name: nginx-package
          path: packages/nginx-*.apk
          retention-days: 30
