name: Release telEgo Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        default: '1.0.0'

env:
  TELEGO_VERSION: "0.6.0"
  LUCI_VERSION: "1.0.0"

jobs:
  build-all-packages:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      
      - name: Download OpenWrt SDK 23.05.6
        run: |
          echo "Downloading OpenWrt SDK..."
          SDK_URL="https://downloads.openwrt.org/releases/23.05.6/sdk/OpenWrt-SDK-23.05.6_x86_64_gcc-x86_64_musl-linux-gnu.tar.gz"
          wget -q "$SDK_URL" --progress=bar:force
          tar -xf OpenWrt-SDK-*.tar.gz
          mv OpenWrt-SDK-* openwrt-sdk
      
      - name: Register Local Feed
        run: |
          cd openwrt-sdk
          echo "src-local file ../package" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      
      - name: Build telEgo Core Package
        working-directory: openwrt-sdk
        run: |
          echo "=== Building telEgo Core Package ==="
          make package/feeds/file/telego/clean V=s
          make package/feeds/file/telego/compile V=s
          ls -lh bin/packages/*/*/telego_*.apk || true
      
      - name: Build LuCI Application Packages
        working-directory: openwrt-sdk
        run: |
          echo "=== Building LuCI Application Packages ==="
          make package/feeds/file/luci-app-telego/clean V=s
          make package/feeds/file/luci-app-telego/compile V=s
          ls -lh bin/packages/*/*/luci-*.apk || true
      
      - name: Build Nginx Configuration Package
        working-directory: openwrt-sdk
        run: |
          echo "=== Building Nginx Configuration Package ==="
          make package/feeds/file/nginx-telego/clean V=s
          make package/feeds/file/nginx-telego/compile V=s
          ls -lh bin/packages/*/*/nginx-*.apk || true
      
      - name: Collect All Built Packages
        run: |
          echo "=== Collecting All Built Packages ==="
          mkdir -p packages
          find openwrt-sdk/bin/packages -name "*.apk" -exec cp {} packages/ \;
          ls -lh packages/*.apk
      
      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v1
        with:
          files: |
            packages/telego_*.apk
            packages/luci-app-telego_*.apk
            packages/luci-i18n-telego-ru_*.apk
            packages/nginx-telego_*.apk
          body: |
            ## Release Notes
            
            ### Packages Included:
            - `telego_${{ env.TELEGO_VERSION }}_x86_64.apk` - telEgo MTProxy + WEB Proxy server
            - `luci-app-telego_${{ env.LUCI_VERSION }}_noarch.apk` - LuCI web interface (EN/RU)
            - `luci-i18n-telego-ru_${{ env.LUCI_VERSION }}_noarch.apk` - Russian translation
            - `nginx-telego_${{ env.TELEGO_VERSION }}_x86_64.apk` - Nginx TLS fronting configuration
            
            ### Installation:
            ```bash
            # Download packages
            wget https://github.com/Ra1nek/telEgo-openwrt/releases/download/v${{ github.event.release.tag_name }}/telego_*.apk
            wget https://github.com/Ra1nek/telEgo-openwrt/releases/download/v${{ github.event.release.tag_name }}/luci-app-telego_*.apk
            
            # Install on OpenWrt
            apk add --allow-untrusted telego_*.apk
            apk add --allow-untrusted luci-app-telego_*.apk
            ```
      
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-packages
          path: packages/*.apk
          retention-days: 30
