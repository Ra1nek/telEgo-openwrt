name: Release telEgo APK Feed

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  OPENWRT_SERIES: '25.12'
  OPENWRT_MIN_RELEASE: '25.12.0'

jobs:
  release-policy:
    runs-on: ubuntu-latest
    outputs:
      telego_version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify release commit belongs to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin 'refs/heads/main:refs/remotes/origin/main'
          release_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if ! git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not point to a commit reachable from main."
            exit 1
          fi

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          pkg_version="$(sed -n 's/^PKG_VERSION:=//p' package/telego-pkg/Makefile | head -n1)"
          test -n "$pkg_version"
          if [[ "$version" != "$pkg_version" ]]; then
            echo "::error::Tag version ${version} does not match package version ${pkg_version}."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  integration-checks:
    needs: release-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Restore host ucode cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/telego/ucode
          key: ${{ runner.os }}-${{ runner.arch }}-telego-ucode-${{ hashFiles('.github/scripts/test-openwrt-integration.sh') }}

      - name: Install host test dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config libjson-c-dev busybox

      - name: Check OpenWrt integration
        run: bash .github/scripts/test-openwrt-integration.sh

  build-release:
    needs: release-policy
    runs-on: ubuntu-latest
    outputs:
      openwrt_matrix: ${{ steps.openwrt_matrix.outputs.matrix }}
    env:
      TELEGO_VERSION: ${{ needs.release-policy.outputs.telego_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: telego-src/go.sum

      - name: Apply OpenWrt source patch
        run: python3 .github/scripts/apply-upstream-patches.py

      - name: Verify LuCI i18n
        run: python3 .github/scripts/check-luci-i18n.py

      - name: Verify Go source
        working-directory: telego-src
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l ./cmd/telego/main.go)"
          if [ -n "$unformatted" ]; then
            echo "::error::OpenWrt-patched Go source is not gofmt-clean:"
            printf '%s\n' "$unformatted"
            exit 1
          fi
          go vet ./...
          go test ./...

      - name: Build Go binary
        working-directory: telego-src
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p ../package/telego-pkg/files/usr/bin
          go build \
            -buildmode=pie \
            -trimpath \
            -buildvcs=false \
            -ldflags="-s -w -I /lib/ld-musl-x86_64.so.1 -X main.version=${TELEGO_VERSION} -X main.commit=${GITHUB_SHA} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o ../package/telego-pkg/files/usr/bin/telego \
            ./cmd/telego
          chmod 0755 ../package/telego-pkg/files/usr/bin/telego
          file ../package/telego-pkg/files/usr/bin/telego
          readelf -l ../package/telego-pkg/files/usr/bin/telego | grep -F '/lib/ld-musl-x86_64.so.1'

      # Release artifacts are rebuilt from the tag against the oldest supported
      # stable APK release. We never publish an artifact copied from an older CI run.
      - name: Build signed APK feed
        uses: openwrt/gh-action-sdk@f5813d30eeef3534b58ac7e79c5d8842b6035434
        env:
          ARCH: x86_64-${{ env.OPENWRT_MIN_RELEASE }}
          FEED_DIR: ${{ github.workspace }}
          FEEDNAME: telego
          PACKAGES: 'telego-pkg nginx-telego luci-app-telego luci-i18n-telego-ru'
          INDEX: 1
          PRIVATE_KEY: ${{ secrets.OPENWRT_APK_PRIVATE_KEY }}
          V: s
          KCONFIG_ALLCONFIG: /feed/.github/openwrt-sdk.config

      - name: Validate release feed
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            telego-pkg
            nginx-telego
            luci-app-telego
            luci-i18n-telego-ru
          )
          for pkg in "${expected[@]}"; do
            if ! find bin/packages -type f -name "${pkg}-*.apk" -print -quit | grep -q .; then
              echo "::error::Missing expected APK: ${pkg}"
              exit 1
            fi
          done
          test -n "$(find bin/packages -type f -name 'packages.adb' -print -quit)"

      - name: Discover stable OpenWrt compatibility matrix
        id: openwrt_matrix
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(python3 .github/scripts/openwrt-release-matrix.py \
            --series "$OPENWRT_SERIES" \
            --minimum "$OPENWRT_MIN_RELEASE")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Compatibility matrix: $matrix"

      - name: Store signed APK feed
        uses: actions/upload-artifact@v7
        with:
          name: telEgo-signed-apk-feed
          path: bin/packages
          if-no-files-found: error
          retention-days: 1

  smoke-release:
    name: Release smoke OpenWrt ${{ matrix.version }}
    needs: build-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.build-release.outputs.openwrt_matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Download signed APK feed
        uses: actions/download-artifact@v7
        with:
          name: telEgo-signed-apk-feed
          path: bin/packages

      - name: Smoke test signed release APKs
        env:
          OPENWRT_VERSION: ${{ matrix.version }}
        run: bash .github/scripts/smoke-openwrt-rootfs.sh bin/packages

  publish-release:
    needs: [release-policy, integration-checks, build-release, smoke-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TELEGO_VERSION: ${{ needs.release-policy.outputs.telego_version }}
    steps:
      - uses: actions/checkout@v7

      - name: Download signed APK feed
        uses: actions/download-artifact@v7
        with:
          name: telEgo-signed-apk-feed
          path: bin/packages

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          python3 .github/scripts/prepare-install-assets.py bin/packages release-assets
          tar -C bin/packages -czf release-assets/telEgo-x86_64-apk-feed.tar.gz .
          (
            cd release-assets
            sha256sum *.apk *.tar.gz telego-install.sha256 > SHA256SUMS
          )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" release-assets/* \
            --verify-tag \
            --generate-notes \
            --title "telEgo ${TELEGO_VERSION}" \
            --latest

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: telEgo-x86_64-apk-feed
          path: release-assets
          if-no-files-found: error
