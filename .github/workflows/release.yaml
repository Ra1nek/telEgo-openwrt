name: Release telEgo APK Feed

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, without leading v'
        required: true
        default: '0.6.0'

env:
  TELEGO_VERSION: '0.6.0'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: telego-src/go.sum

      - name: Verify Go source
        working-directory: telego-src
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

      - name: Build Go binary
        run: |
          set -euo pipefail
          mkdir -p package/telego-pkg/files/usr/bin
          go build \
            -buildmode=pie \
            -trimpath \
            -ldflags="-s -w -X main.version=${TELEGO_VERSION} -X main.commit=${GITHUB_SHA}" \
            -o package/telego-pkg/files/usr/bin/telego \
            ./telego-src/cmd/telego
          chmod 0755 package/telego-pkg/files/usr/bin/telego

      - name: Build signed APK feed
        uses: openwrt/gh-action-sdk@f5813d30eeef3534b58ac7e79c5d8842b6035434
        env:
          ARCH: x86_64
          FEED_DIR: ${{ github.workspace }}
          FEEDNAME: telego
          PACKAGES: 'telego-pkg nginx-telego luci-app-telego luci-i18n-telego-ru'
          INDEX: 1
          PRIVATE_KEY: ${{ secrets.OPENWRT_APK_PRIVATE_KEY }}
          V: s

      - name: Validate release feed
        run: |
          set -euo pipefail
          test -n "$(find bin/packages -type f -name '*.apk' -print -quit)"
          test -n "$(find bin/packages -type f -name 'packages.adb' -print -quit)"
          mkdir -p release-assets
          find bin/packages -type f -name '*.apk' -exec cp {} release-assets/ \;
          tar -C bin/packages -czf release-assets/telEgo-x86_64-apk-feed.tar.gz .
          sha256sum release-assets/* > release-assets/SHA256SUMS

      - name: Determine release tag
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" release-assets/* \
            --verify-tag \
            --generate-notes \
            --title "telEgo ${TAG#v}" \
            --latest

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: telEgo-x86_64-apk-feed
          path: release-assets/**
          if-no-files-found: error
