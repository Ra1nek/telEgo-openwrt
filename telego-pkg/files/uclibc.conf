#
# uClibc Configuration for telEgo
# ================================
#
# This file configures uClibc (micro C library) settings for the telego binary.
# Used when building Go binaries with musl/uClibc libc on OpenWrt systems.
#
# Reference: https://wiki.golang.org/distros
#

# Enable large file support (>2GB files)
_LFS_CFLAGS=-D_LARGEFILE_SOURCE -D_FILE_OFFSET_BITS=64
_LFS_LDFLAGS=

# Stack size configuration (important for Go runtime)
STACK_SIZE=8388608

# Memory mapping settings
MALLOC_CHECK_=0
MALLOC_TRIM_THRESHOLD_=12582912

# Thread stack size
PTHREAD_STACK_SIZE=262144
