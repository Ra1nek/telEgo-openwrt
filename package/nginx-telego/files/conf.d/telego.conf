# This configuration enables WEB Proxy by fronting TLS through Nginx
upstream telego_web {
	server 127.0.0.1:8080;
}

server {
	listen 8443 ssl;
	server_name _;

	# SSL Configuration (certificates from Let's Encrypt)
	ssl_certificate /etc/ssl/certs/telego.crt;
	ssl_certificate_key /etc/ssl/private/telego.key;

	# TLS Settings
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
	ssl_prefer_server_ciphers on;

	# HTTP/2 for https-lanes carrier mode
	http2 on;

	# WEB Proxy ingress
	location / {
		proxy_pass http://telego_web;
		proxy_http_version 1.1;
		
		# Pass required headers
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		
		# WebSocket support
		if ($http_upgrade = "websocket") {
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
		}
		
		# Timeouts for long-poll
		proxy_read_timeout 40s;
		proxy_send_timeout 40s;
	}

	# ACME challenge location for certificate renewal
	location /.well-known/acme-challenge/ {
		root /var/www/certbot;
		try_files $uri =404;
	}
}