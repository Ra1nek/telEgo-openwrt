# telEgo Nginx integration.
#
# This file is included from nginx http{} context. It intentionally does not
# create a public TLS server, because that would conflict with an existing
# site/certificate configuration on the router.
#
# For the public TLS server, include:
#   /etc/nginx/snippets/telego.locations
#
# In the shared-port layout, the public Telego listener splices TLS to a
# private Nginx TLS server (typically 127.0.0.1:8443) configured by the site
# administrator with the real certificate and `proxy_protocol`.

map $http_upgrade $telego_connection_upgrade {
	default upgrade;
	''      '';
}

upstream telego_web {
	server 127.0.0.1:8080;
	keepalive 64;
}
