# telEgo Nginx integration.
#
# This file is included from nginx http{} context. It intentionally does not
# create a public TLS server, because that would conflict with an existing
# site/certificate configuration on the router.
#
# For a hand-written public TLS server, include:
#   /etc/nginx/snippets/telego.locations
#
# nginx-telego can also render one opt-in managed ingress profile from
# /etc/config/nginx_telego: native shared-port, Cloudflare Tunnel, or Direct
# HTTPS on the firewall redirect backend port 18443.

map $http_upgrade $telego_connection_upgrade {
	default upgrade;
	''      '';
}

# The core Nginx PROXY-protocol variable is available without the optional
# http_realip module. Shared-port ingress receives PROXY v2 from telEgo; normal
# TLS servers do not, so they fall back to the direct peer address.
map $proxy_protocol_addr $telego_client_ip {
	default $proxy_protocol_addr;
	''      $remote_addr;
}

upstream telego_web {
	server 127.0.0.1:8080;
	keepalive 64;
}
