# General settings
[general]

# Unix socket: "/run/telego/telego.sock" or "unix:///run/telego/telego.sock"
bind-to = "0.0.0.0:443"

# Log level: trace, debug, info, warn, error
log-level = "info"

# Accept incoming PROXY protocol (for reverse proxy setups)
proxy-protocol = false

# Connection limits
max-connections-per-ip = 100
max-ips-per-user = 10
ip-block-timeout = "1h"
handshake-timeout = "5s"

# Generate with: telego generate <hostname>
[secrets]
user1 = "0123456789abcdef0123456789abcdef"

# TLS fronting configuration
[tls-fronting]
enabled = true

# Must match the hostname in your secret
mask-host = "www.google.com"

# Default port (default: 443)
mask-port = 443

# Certificate fetching - where to connect to get real TLS cert
# Defaults to mask-host:mask-port if not set
cert-host = ""
cert-port = 0

# This section has no effect while enabled is false. Changes require a restart.
[web-proxy]
enabled = false

# It requires public HTTP/2. WebSocket modes require HTTP/1.1 upgrade forwarding.
carrier = "https-lanes"

# Bind address for WEB proxy (default: 127.0.0.1:8443)
bind-to = "127.0.0.1:8443"

# Hostname for WEB proxy (defaults to tls-fronting.mask-host)
hostname = ""

# Backend address (defaults to mask-host:mask-port)
backend = ""

# Trusted proxy CIDRs for X-Forwarded-For validation
trusted-proxy-cidrs = ["127.0.0.0/8"]

# Performance tuning (all optional)
[performance]

# TCP buffer size in KB (default: 128)
tcp-buffer-kb = 128

# IP preference for DC connections: prefer-ipv4, prefer-ipv6, only-ipv4, only-ipv6
prefer-ip = "prefer-ipv4"

# Connection idle timeout (default: 5m)
idle-timeout = "5m"

# Number of event loops (0 = auto, uses all CPU cores)
num-event-loops = 0

# Upstream (DC connection) settings
[upstream]

# Retry delay on DC disconnect (default: 1s)
retry-delay = "1s"

# Connection timeout to DC (default: 10s)
connect-timeout = "10s"

# Prometheus metrics endpoint (optional)
[metrics]
enabled = false
bind-to = "127.0.0.1:9090"